<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CineAgent AI · 视频实验室</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#edf2f7;background:#0b1020}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#1c2b49 0,transparent 36%),#0b1020}main{max-width:900px;margin:0 auto;padding:36px 20px 70px}.eyebrow{color:#9db7e7;letter-spacing:.14em;font-size:12px}h1{font-size:clamp(32px,6vw,54px);line-height:1.05;margin:12px 0}p{color:#b8c4d8;line-height:1.6}.panel{background:#121a2b;border:1px solid #293650;border-radius:18px;padding:22px;margin-top:22px}label{display:block;margin:14px 0 7px;color:#dbe5f5;font-size:14px}input,textarea,select{width:100%;padding:12px 13px;border-radius:10px;border:1px solid #34445f;background:#0b1221;color:#f5f7fb;font:inherit}textarea{min-height:110px;resize:vertical}button{margin-top:18px;border:0;border-radius:10px;padding:12px 16px;background:#dce8ff;color:#10203a;font-weight:700;cursor:pointer}button.secondary{background:#293850;color:#f5f7fb;margin-left:8px}.status{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a101d;padding:14px;border-radius:10px;color:#cfe0ff;font-size:13px;margin-top:14px}a{color:#a9c9ff}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head><body><main><div class="eyebrow">AI FILMMAKING WORKSPACE · MVP 0.1</div><h1>让故事变成<br>电影镜头。</h1><p>创建短片项目，提交给 Agnes AI 生成第一段视频，再刷新任务状态。当前版本是最小验证链路，尚未包含完整的多镜头编排与长期角色记忆。</p><section class="panel"><form id="projectForm"><label for="title">项目名称</label><input id="title" required maxlength="120" value="Mia · 森林的秘密"><label for="premise">故事梗概</label><textarea id="premise" required minlength="10">一位年轻女性独自走进被晨雾笼罩的森林，在古老树根旁发现一枚散发微光的神秘物品。她小心拾起它，森林中的光线随之改变。</textarea><label for="style">视觉风格</label><input id="style" value="cinematic realism, soft morning mist, natural skin texture, slow dolly-in, subtle film grain"><div class="row"><div><label for="ratio">画幅</label><select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option></select></div><div><label for="duration">单镜头时长（秒）</label><select id="duration"><option value="5">5 秒（推荐测试）</option><option value="8">8 秒</option><option value="10">10 秒</option><option value="15">15 秒</option><option value="20">20 秒</option></select></div></div><button type="submit">创建项目</button></form><div id="actions" hidden><button id="generate">提交视频生成</button><button class="secondary" id="refresh">刷新任务状态</button></div><div id="status" class="status">正在检查后端……</div></section><p>安全提示：API 密钥仅保存在后端环境变量中。不要把真实密钥写入网页或提交到 GitHub。</p>
<script>
let currentId=null;const statusEl=document.getElementById('status');function show(v){statusEl.textContent=typeof v==='string'?v:JSON.stringify(v,null,2)}async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});const d=await r.json();if(!r.ok)throw new Error(d.detail||JSON.stringify(d));return d}api('/api/health').then(show).catch(e=>show('后端连接失败：'+e.message));document.getElementById('projectForm').addEventListener('submit',async e=>{e.preventDefault();try{const p=await api('/api/projects',{method:'POST',body:JSON.stringify({title:document.getElementById('title').value,premise:document.getElementById('premise').value,style:document.getElementById('style').value,aspect_ratio:document.getElementById('ratio').value,duration_seconds:Number(document.getElementById('duration').value)})});currentId=p.id;document.getElementById('actions').hidden=false;show(p)}catch(err){show('创建失败：'+err.message)}});document.getElementById('generate').addEventListener('click',async()=>{if(!currentId)return;try{show(await api(`/api/projects/${currentId}/generate`,{method:'POST'}))}catch(e){show('提交失败：'+e.message)}});document.getElementById('refresh').addEventListener('click',async()=>{if(!currentId)return;try{show(await api(`/api/projects/${currentId}/refresh`,{method:'POST'}))}catch(e){show('查询失败：'+e.message)}});
</script></main></body></html>
